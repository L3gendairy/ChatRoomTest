<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        /* Hide elements by default */
        .hidden {
            display: none !important;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        #chatBox {
            height: 250px;
            border: 1px solid #ddd;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
            border-radius: 5px;
        }

        .msg {
            margin-bottom: 8px;
            font-size: 14px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="box">
        <h2>Welcome!</h2>
        <p>Choose a username to join:</p>
        <input type="text" id="usernameInput" placeholder="Enter username..." onkeypress="handleLoginKey(event)">
        <br>
        <button onclick="login()">Enter Chat</button>
    </div>

    <!-- 2. CHAT ROOM SCREEN -->
    <div id="chatScreen" class="box hidden">
        <h2>Chat Room</h2>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleSendKey(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Set to your Localtunnel URL
        const SERVER_URL = "https://metal-teeth-warn.loca.lt"; 
        let currentUsername = "";

        function handleLoginKey(e) {
            if (e.key === "Enter") {
                login();
            }
        }

        function handleSendKey(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        function login() {
            const input = document.getElementById("usernameInput").value.trim();
            if (input !== "") {
                currentUsername = input;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("chatScreen").classList.remove("hidden");
                
                // Fetch messages right away, then check for new ones every 2 seconds
                loadMessages();
                setInterval(loadMessages, 2000);
            }
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${SERVER_URL}/get-messages`, {
                    headers: {
                        "Bypass-Tunnel-Remainder": "true"
                    }
                });
                const data = await res.json();
                
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML = "";
                
                data.messages.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    div.textContent = msg;
                    chatBox.appendChild(div);
                });
                
                // Auto scroll to bottom
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.log("Server is offline or tunnel warning active:", err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();

            if (message !== "") {
                input.value = ""; // Clear input immediately for smooth UX

                try {
                    await fetch(`${SERVER_URL}/send-message`, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "Bypass-Tunnel-Remainder": "true"
                        },
                        body: JSON.stringify({
                            username: currentUsername,
                            message: message
                        })
                    });

                    loadMessages();
                } catch (err) {
                    console.log("Error sending message:", err);
                }
            }
        }
    </script>
</body>
</html>
