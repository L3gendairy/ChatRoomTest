<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        /* Hide elements by default */
        .hidden {
            display: none !important;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        #chatBox {
            height: 250px;
            border: 1px solid #ddd;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
            border-radius: 5px;
        }

        .msg {
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="box">
        <h2>Welcome!</h2>
        <p>Choose a username to join:</p>
        <input type="text" id="usernameInput" placeholder="Enter username...">
        <br>
        <button onclick="login()">Enter Chat</button>
    </div>

    <!-- 2. CHAT ROOM SCREEN -->
    <div id="chatScreen" class="box hidden">
        <h2>Chat Room</h2>
        <div id="chatBox"></div>
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Set this to your Python server URL (or your ngrok URL when hosted online)
        const SERVER_URL = "http://127.0.0.1:5000"; 
        let currentUsername = "";

        function login() {
            const input = document.getElementById("usernameInput").value.trim();
            if (input !== "") {
                currentUsername = input;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("chatScreen").classList.remove("hidden");
                
                // Fetch messages right away, then check for new ones every 2 seconds
                loadMessages();
                setInterval(loadMessages, 2000);
            }
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${SERVER_URL}/get-messages`);
                const data = await res.json();
                
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML = "";
                
                data.messages.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    div.textContent = msg;
                    chatBox.appendChild(div);
                });
                
                // Auto scroll to bottom
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.log("Server is currently offline.");
            }
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();

            if (message !== "") {
                await fetch(`${SERVER_URL}/send-message`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: currentUsername,
                        message: message
                    })
                });

                input.value = "";
                loadMessages();
            }
        }
    </script>
</body>
</html>
